server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10m;

    # Coolify/Traefik está delante de este Nginx. Confiar en X-Forwarded-For
    # solo desde rangos privados de Docker para recuperar la IP real.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Resolver interno de Docker. Se usa una variable en proxy_pass para que
    # Nginx vuelva a resolver `api` si el contenedor cambia de IP al redeploy.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # La API conserva el prefijo /api; FastAPI lo elimina con su middleware.
    location ^~ /api/ {
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Un solo proxy delante: sobrescribir para no confiar en un
        # X-Forwarded-For enviado por el cliente.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # Health check público opcional: https://dominio/health
    location = /health {
        proxy_pass $api_upstream/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Assets con hash de Vite: cache larga.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: cualquier ruta desconocida vuelve a index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
