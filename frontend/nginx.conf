# Solo se normalizan los dominios de producción. Localhost y los healthchecks
# siguen funcionando por HTTP; X-Forwarded-Proto lo establece Coolify/Traefik.
map "$host:$http_x_forwarded_proto" $seo_redirect {
    default 0;
    ~^www\.carnetisena\.com: 1;
    "carnetisena.com:http" 1;
    "carnetisena.com:" 1;
}

map $uri $seo_robots {
    default "noindex, follow";
    / "";
    /index.html "";
    /guia "";
    /guia/index.html "";
    /robots.txt "";
    /sitemap.xml "";
    ~^/assets/ "";
    ~\.(png|ico|svg|webmanifest)$ "";
}

map $uri $seo_cache {
    default "no-store";
    ~^/assets/ "public, max-age=31536000, immutable";
    ~\.(png|ico|svg|webmanifest)$ "public, max-age=86400";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    # Los redirects relativos conservan el HTTPS del navegador aunque Nginx
    # reciba HTTP interno desde Traefik.
    absolute_redirect off;

    if ($seo_redirect) {
        return 308 https://carnetisena.com$request_uri;
    }

    client_max_body_size 10m;

    # Coolify/Traefik está delante de este Nginx. Confiar en X-Forwarded-For
    # solo desde rangos privados de Docker para recuperar la IP real.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Resolver interno de Docker. Se usa una variable en proxy_pass para que
    # Nginx vuelva a resolver `api` si el contenedor cambia de IP al redeploy.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag $seo_robots always;
    add_header Cache-Control $seo_cache always;

    # La API conserva el prefijo /api; FastAPI lo elimina con su middleware.
    location ^~ /api/ {
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Un solo proxy delante: sobrescribir para no confiar en un
        # X-Forwarded-For enviado por el cliente.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # Health check público opcional: https://dominio/health
    location = /health {
        proxy_pass $api_upstream/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Assets con hash de Vite: cache larga.
    location /assets/ {
        try_files $uri =404;
    }

    location = / {
        try_files /index.html =404;
    }

    location = /guia {
        try_files /guia/index.html =404;
    }

    location = /index.html {
        return 308 /$is_args$args;
    }

    location = /guia/ {
        return 308 /guia$is_args$args;
    }

    location = /guia/index.html {
        return 308 /guia$is_args$args;
    }

    # La portada pública nunca se devuelve como HTML de una ruta privada.
    # Mantener esta lista en sincronía con src/seo/site.mjs (test:seo lo verifica).
    location ~ ^/(login|forgot-password|reset-password|panel|mi-carnet|usuarios|grupos|centros|programas|carnets|asistencia|escanear-clase|qr-clase|reportes|validar|ayuda)/?$ {
        try_files /app.html =404;
    }

    location = /app.html { internal; }
    location = /404.html { internal; }
    error_page 404 /404.html;

    # Las URL inexistentes son 404 reales, no una portada con estado 200.
    location / {
        try_files $uri =404;
    }
}
